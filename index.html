<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Generative art seeded by your name. The same name always gives the same artwork." />
  <meta name="theme-color" content="#171a21" />
  <title>Chromatica</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238b7cf6'/%3E%3Cpolygon points='16,7 24.5,21.5 7.5,21.5' fill='%23f6f1e7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Chromatica</h1>
    <p class="tagline">Generative art, seeded by a name.</p>
  </header>

  <div class="workspace">
    <aside class="controls" aria-label="Controls">
      <section>
        <h2 class="section-title">Seed</h2>
        <label class="field">
          <span class="label">Your full name</span>
          <input id="name" type="text" autocomplete="off" spellcheck="false" maxlength="80" placeholder="Type a name" />
        </label>
        <label class="field">
          <span class="label">Seed number</span>
          <input id="seed" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" />
        </label>
        <p id="hint" class="hint" aria-live="polite"></p>
        <button id="random-name" type="button">Random name</button>
      </section>

      <section>
        <h2 class="section-title">Style</h2>
        <label class="field">
          <span class="label">Shape</span>
          <select id="shape">
            <option value="mixed">Mixed</option>
            <option value="circle">Circles</option>
            <option value="rect">Squares</option>
            <option value="polygon">Polygons</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Min size <output id="sizeMin-out"></output></span>
          <input id="sizeMin" type="range" min="4" max="100" step="1" />
        </label>

        <label class="field">
          <span class="label">Max size <output id="sizeMax-out"></output></span>
          <input id="sizeMax" type="range" min="10" max="140" step="1" />
        </label>

        <label class="field">
          <span class="label">Density <output id="density-out"></output></span>
          <input id="density" type="range" min="0" max="1" step="0.05" />
        </label>

        <label class="field">
          <span class="label">Palette</span>
          <select id="paletteMode">
            <option value="auto">Auto (from seed)</option>
            <option value="complementary">Complementary</option>
            <option value="analogous">Analogous</option>
            <option value="triadic">Triadic</option>
          </select>
        </label>

        <label class="check">
          <input id="fractal" type="checkbox" />
          <span>Fractal tree <small id="fractal-info"></small></span>
        </label>

        <div id="swatches" class="swatches" role="img" aria-label="Current palette"></div>
      </section>

      <section>
        <h2 class="section-title">Export</h2>
        <div class="row">
          <button id="export-png" type="button">Download PNG</button>
          <button id="export-svg" type="button">Download SVG</button>
        </div>
      </section>

      <section>
        <h2 class="section-title">Favorites</h2>
        <button id="save-favorite" type="button">Save this artwork</button>
        <ul id="favorites" class="favorites"></ul>
        <p id="favorites-empty" class="hint">Nothing saved yet.</p>
      </section>
    </aside>

    <main class="stage">
      <canvas id="art" aria-label="Generated artwork"></canvas>
    </main>
  </div>

  <footer class="statusbar">
    <span id="status">--</span>
    <span id="message" role="status" aria-live="polite"></span>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
